<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d4213d">
  <title>Polish Learning</title>
  <!-- ?v= makes browsers fetch fresh files after an update: change it on every publish. -->
  <link rel="stylesheet" href="style.css?v=2026-10-23">
</head>
<body>
  <script>
    // Show unexpected errors on the page itself: some hosts (like claude.ai pages) hide the console.
    window.addEventListener("error", (e) => {
      let bar = document.getElementById("error-bar");
      if (!bar) {
        bar = document.createElement("div");
        bar.id = "error-bar";
        bar.className = "error-bar";
        bar.setAttribute("role", "alert");
        document.body.prepend(bar);
      }
      const where = e.filename ? ` (${e.filename.split("/").pop().split("?")[0]}, line ${e.lineno})` : "";
      bar.textContent = `Something went wrong: ${e.message}${where}`;
    });
  </script>
  <header>
    <div class="brand">
      <button id="grammar-toggle" class="grammar-toggle" aria-controls="grammar-nav" aria-expanded="false">☰ Grammar</button>
      <h1>Polish Learning</h1>
    </div>
    <nav>
      <button data-view="home" class="active">Home</button>
      <button data-view="study">Study</button>
      <button data-view="read">Read</button>
    </nav>
  </header>

  <div class="layout">
  <!-- Grammar topics: a sidebar on wide screens, a slide-in drawer on phones -->
  <aside id="grammar-nav" class="grammar-nav" aria-label="Grammar topics">
    <div class="grammar-nav-head">
      <strong>Grammar</strong>
      <button id="grammar-close" class="grammar-close" aria-label="Close grammar menu">✕</button>
    </div>
    <div id="grammar-topics"></div>
  </aside>
  <div id="grammar-backdrop" class="backdrop"></div>

  <main>
    <!-- Grammar page (a topic, or all forms of one word) -->
    <section id="grammar" class="view">
      <button id="grammar-back" class="link back-link"></button>
      <article id="grammar-page" class="grammar-page"></article>
    </section>

    <!-- Home: greeting, shortcuts to each section, word of the day -->
    <section id="home" class="view active">
      <div class="hero">
        <p class="hero-hello" id="home-hello"></p>
        <h2 id="home-title"></h2>
        <p class="hero-intro" id="home-intro"></p>
      </div>

      <div class="tiles">
        <button class="tile tile-main" data-go="study">
          <span class="tile-name">Study</span>
          <span class="tile-info" id="tile-study"></span>
        </button>
        <button class="tile" data-go="read">
          <span class="tile-name">Read</span>
          <span class="tile-info" id="tile-read"></span>
        </button>
        <button class="tile" data-go="grammar">
          <span class="tile-name">Grammar</span>
          <span class="tile-info" id="tile-grammar"></span>
        </button>
      </div>

      <div class="word-of-day" id="word-of-day">
        <p class="g-group" id="wod-label"></p>
        <p class="wod-word" id="wod-word"></p>
        <p class="wod-meaning" id="wod-meaning"></p>
        <div class="example" id="wod-example">
          <p class="sentence"></p>
          <p class="translation"></p>
        </div>
      </div>
    </section>

    <!-- Study: lessons (list, or one lesson open) -->
    <section id="study" class="view">
      <div id="lesson-index">
        <div>
          <p class="g-group">Study</p>
          <h2>Lessons</h2>
          <p class="stats" id="lesson-progress"></p>
        </div>
        <div class="lesson-list" id="lesson-list"></div>
      </div>
      <article class="lesson hidden" id="lesson"></article>
    </section>

    <!-- Reading view -->
    <section id="read" class="view">
      <div class="editor-bar editor-only">
        <span><strong>Editor mode.</strong> New texts and meanings are drafts on this device until you export them.</span>
        <button id="export-content">Export content file</button>
      </div>

      <div class="text-bar">
        <select id="text-picker" aria-label="Choose a text"></select>
        <button id="new-text" class="editor-only">+ New text</button>
      </div>

      <form id="text-form" class="hidden">
        <input id="text-title" placeholder="Title (e.g. Moja rodzina)" required autocomplete="off">
        <input id="text-title-en" placeholder="English title, optional (e.g. My family)" autocomplete="off">
        <label class="field-inline" for="text-level">Level
          <select id="text-level">
            <option>A1</option><option>A2</option><option>B1</option>
            <option>B2</option><option>C1</option><option>C2</option>
          </select>
        </label>
        <textarea id="text-body" rows="7" placeholder="Paste or type Polish text…" required></textarea>
        <textarea id="text-translation" rows="4" placeholder="English translation, optional. With the same number of sentences, each sentence gets its own translation."></textarea>
        <div class="form-actions">
          <button type="button" id="cancel-text">Cancel</button>
          <button class="primary" type="submit">Save text</button>
        </div>
      </form>

      <div id="reading-body">
        <div>
          <span class="level-badge" id="reading-level"></span>
          <h2 id="reading-title"></h2>
          <p class="stats" id="reading-subtitle"></p>
        </div>
        <div class="reading-text" id="reading-text"></div>
        <p class="hint" id="reading-help">
          Tap any word to see what it means.
          <span class="editor-only"><span class="key key-new">dashed</span> = no meaning yet, tap to add one.</span>
        </p>
        <details id="translation-box">
          <summary>Show English translation</summary>
          <div id="reading-translation"></div>
        </details>
        <section class="exercises hidden" id="exercises" aria-label="Exercises"></section>
        <button id="delete-text" class="link editor-only">Delete this draft</button>
      </div>
    </section>
  </main>
  </div>

  <!-- Word details for reading mode -->
  <aside id="sheet" class="sheet hidden" aria-live="polite">
    <button id="sheet-close" class="sheet-close" aria-label="Close">✕</button>
    <div id="sheet-view" class="sheet-section">
      <div class="sheet-head">
        <span id="sheet-word" class="sheet-word"></span>
        <span id="sheet-form" class="sheet-form"></span>
      </div>
      <p id="sheet-meaning" class="sheet-meaning"></p>
      <p id="sheet-note" class="sheet-note"></p>
      <div id="sheet-links" class="sheet-links hidden"></div>
    </div>
    <form id="sheet-edit" class="sheet-section hidden">
      <p id="edit-heading" class="sheet-edit-heading"></p>
      <input id="edit-lemma" placeholder="Dictionary form (e.g. pies)" aria-label="Dictionary form" required autocomplete="off">
      <input id="edit-meaning" placeholder="Meaning (e.g. dog)" aria-label="Meaning" required autocomplete="off">
      <input id="edit-note" placeholder="Note, optional (e.g. accusative case)" aria-label="Note" autocomplete="off">
      <div class="form-actions">
        <button type="button" id="cancel-edit">Cancel</button>
        <button class="primary" type="submit">Save word</button>
      </div>
    </form>
    <div class="example" id="sheet-example">
      <p class="sentence"></p>
      <p class="translation"></p>
    </div>
    <div id="sheet-actions" class="sheet-actions editor-only">
      <button id="edit-word">Edit</button>
    </div>
  </aside>

  <script src="content/pl.js?v=2026-10-23"></script>
  <script src="content/pl-grammar.js?v=2026-10-23"></script>
  <script src="content/pl-verbs.js?v=2026-10-23"></script>
  <script src="content/pl-lessons.js?v=2026-10-23"></script>
  <script src="content/es.js?v=2026-10-23"></script>
  <script src="app.js?v=2026-10-23"></script>
  <script src="reading.js?v=2026-10-23"></script>
  <script src="grammar.js?v=2026-10-23"></script>
  <script src="lessons.js?v=2026-10-23"></script>
</body>
</html>
